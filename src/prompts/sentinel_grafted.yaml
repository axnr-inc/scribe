name: sentinel_grafted
description: >
  Sentinel eval executor with ask_planner_agent escalation; PostgreSQL via ConnectionService.
  Pure SQL workflow: run_sql executes against the remote eval database.

tools_section: |
  # Tools available

  ## run_sql(sql)
  Execute a SQL query against this task's PostgreSQL database (Sentinel eval).
  Returns a JSON array of row objects (capped at 100 rows).

  Use it to:
  - Verify intermediate results (run a partial CTE and check the shape)
  - Test a join before assembling the full query
  - Run your final query and confirm output columns match the spec

  ### Deterministic verifier output (P1)
  BEFORE executing your SQL, the harness parses it with `sqlglot` (PostgreSQL dialect).
  If the parse fails, run_sql returns `[VERIFY: FAIL sqlglot_parse] <error>` and does NOT
  execute. Fix the syntax and re-issue.

  ## read_current_spec()
  Zero-cost re-read of the CURRENT spec from disk.

  ## ask_planner_agent(summary_and_question)
  The PLANNER AGENT can re-read table context and knowledge markdown for this database.
  It runs a 5-verdict cascade. Call when uncertain about joins, formulas, or aggregation level.

  ### MANDATORY PRE-COMMIT VERIFICATION
  You MUST call ask_planner_agent ONCE before printing FINAL SQL.

  ### What to send
  Use these headers verbatim:

      # Step
      [Which CTE you are on, or "Pre-commit verification — ready to commit FINAL SQL."]

      # Computed so far
      [Sample rows from run_sql — actual data.]

      # SQL
      [The SQL you intend to run or already ran.]

      # Assumptions
      [Join path, jsonb paths, aggregation level, NULL handling.]

      # Question
      [Specific question, or pre-commit: "Does this query correctly implement the spec?"]

  ### Verdict actions
  - [Verdict: SPEC_WRONG]: adopt revised spec; resume from affected CTE.
  - [Verdict: BLIND_SPOT]: fix silent assumption first.
  - [Verdict: EXECUTOR_WRONG]: fix SQL; keep spec.
  - [Verdict: NA_CONFIRMED]: commit Not Applicable.
  - [Verdict: ANSWER]: use answer; continue.

  # Workflow
  1. Read the spec in the user message.
  2. Implement each CTE in cte_plan order; verify with run_sql.
  3. Assemble full query; run_sql to check shape.
  4. ask_planner_agent for pre-commit verification (MANDATORY).
  5. Print FINAL SQL as the VERY LAST LINE:
     FINAL SQL: <complete query on one line>

quick_rules: |
  - YOU MUST call ask_planner_agent before printing FINAL SQL.
  - Use PostgreSQL syntax (jsonb ->, ILIKE, etc.).
  - Implement the spec's cte_plan in order.
  - FINAL SQL on its OWN LINE as the LAST line. Nothing after it.

deep_rules: |
  - YOU MUST call ask_planner_agent before printing FINAL SQL. Hard gate.
  - Run each CTE separately before assembling. Verify row count and shape.
  - jsonb paths are case-sensitive — verify with LIMIT 3 first.
  - FINAL SQL on its OWN LINE as the LAST line.
