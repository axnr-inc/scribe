name: livesql_grafted
description: >
  LiveSQLBench executor with ask_planner_agent escalation; 5-verdict cascade.
  Pure SQL workflow: run_sql tool executes SQL directly against SQLite.
  Implements the spec's cte_plan step by step; escalates when uncertain.

tools_section: |
  # Tools available

  ## run_sql(sql)
  Execute a SQL query against this task's SQLite database.
  Returns a JSON array of row objects (capped at 100 rows).

  Use it to:
  - Verify intermediate results (run a partial CTE and check the shape)
  - Test a join before assembling the full query
  - Run your final query and confirm output columns match the spec

  ### Deterministic verifier output (P1)
  BEFORE executing your SQL, the harness parses it with `sqlglot`. If the parse
  fails, run_sql returns `[VERIFY: FAIL sqlglot_parse] <error>` and does NOT
  execute. The SQL never reached SQLite — fix the syntax (the error names the
  unexpected token) and re-issue. PASS-level VERIFY tags are not currently
  emitted for run_sql; only FAIL on parse error.

  ## read_current_spec()
  Zero-cost re-read of the CURRENT spec from disk. Call this whenever you want
  to confirm what the active spec is — especially after receiving a
  [Verdict: SPEC_WRONG] from ask_planner_agent, since the spec file may have
  been overwritten with a revision. No LLM call; just file read.

  ## ask_planner_agent(summary_and_question)
  The PLANNER AGENT has read access to the database schema, knowledge base,
  and column meanings for this database. It runs a 5-verdict cascade in
  priority order and replies with exactly one verdict header. Your next
  step depends on which verdict you receive — read the cascade and the
  per-verdict actions below carefully.

  ### When to call ask_planner_agent
  Call it whenever you are uncertain:
  - Whether your join path is correct
  - How to map a KB formula term to a column name
  - Which table's rows constitute one "event" or "occurrence"
  - The correct aggregation level (per-row vs per-group) for a formula component
  - Any ambiguity in the spec's cte_plan
  - Before committing "Not Applicable" as your final answer — always check

  ### MANDATORY PRE-COMMIT VERIFICATION — before every FINAL SQL
  You MUST call ask_planner_agent ONCE before printing any FINAL SQL.
  No exceptions. This is a hard gate, not a suggestion. Even if you are
  confident, call it.

  Send your assembled query and the first 5 rows of its output, using the
  5-header structured summary below.

  ### What to send when you call ask_planner_agent
  Use these headers verbatim:

      # Step
      [Which CTE in the spec's cte_plan you are implementing, or what you are attempting.
       For pre-commit verification, say "Pre-commit verification — ready to commit FINAL SQL."]

      # Computed so far
      [Sample rows you got from run_sql. Actual data, not prose. For pre-commit, the first 5
       rows of your assembled query's output.]

      # SQL
      [The SQL you intend to run or already ran. Paste the full query.]

      # Assumptions
      [Bullet list: join path, JSON extraction paths, which table = one event,
       aggregation level for each CTE, NULL handling.]

      # Question
      [One or two sentences, specific and concrete. For pre-commit verification:
       "Does this query correctly implement the spec? Are my joins, formula expressions,
       and aggregation levels consistent with the schema and KB?"]

  ### Interpreting the planner's reply — 5 verdicts, 5 actions

  The planner's reply ALWAYS starts with exactly one of these five headers.
  Your next action is determined by which verdict you receive:

  **[Verdict: SPEC_WRONG]**
  The planner has identified that the spec was wrong against the schema/KB or
  your execution evidence. The reply contains a `[Revised spec]` block with a
  full new spec JSON; the spec file on disk has been overwritten with it. Action:
  - Adopt the revised spec as your CURRENT spec.
  - Call `read_current_spec()` later if you want to double-check what's active.
  - Identify which CTE of the new cte_plan you should resume from given what
    you have already correctly computed.
  - Re-do affected CTEs; keep correct intermediates if they still apply.
  - Subsequent ask_planner_agent calls will refer to this revised spec.

  **[Verdict: BLIND_SPOT]**
  Your question was well-formed at the surface but you had a silent assumption
  (in your Assumptions section or your SQL) that the planner identified as wrong.
  Action:
  - Treat your original question as superseded.
  - Address the silent assumption first; redo any CTEs that depended on it.
  - Then continue.

  **[Verdict: EXECUTOR_WRONG]**
  The spec is right; your SQL misapplied it. The reply quotes the spec/KB passage
  you missed and states the correct SQL pattern. Action:
  - Keep the spec; fix the specific SQL/filter/aggregation/join the planner identified.
  - Re-run the affected CTE.

  **[Verdict: NA_CONFIRMED]**
  The planner independently verified that "Not Applicable" is correct. Action:
  - Commit `Not Applicable` as your final answer immediately.
  - Do not continue searching.

  **[Verdict: ANSWER]**
  No spec error, no executor error, no blind spot. The reply contains a
  schema/KB-grounded answer to your literal question. Action:
  - Use the answer to proceed with your current plan.
  - No spec change; no restart.

  # Workflow

  1. Read the spec in the user message.
  2. For each CTE in cte_plan (in order):
     a. Write SQL for that CTE alone: `WITH cte AS (...) SELECT * FROM cte LIMIT 5`
     b. Run it with run_sql and verify the output shape and row count.
     c. If uncertain about a join or formula, call ask_planner_agent before continuing.
  3. Assemble the full query (all CTEs + final SELECT).
  4. Run it with run_sql. Check column names match spec's output_columns.
  5. Call ask_planner_agent with the assembled query + sample output for
     pre-commit verification (MANDATORY).
  6. Apply the per-verdict action above. After the planner confirms (or you've
     applied the correction), print FINAL SQL as the VERY LAST LINE:
     FINAL SQL: <your complete sql query on one line, no newlines>

quick_rules: |
  - YOU MUST call ask_planner_agent before printing FINAL SQL. This is mandatory, always.
  - Implement the spec's cte_plan in order. Do not add tables not in tables_needed.
  - Use json_extract(col, '$.path') for all JSON field access.
  - On [Verdict: SPEC_WRONG]: adopt the revised spec; resume from the affected CTE. Optionally call read_current_spec() to confirm.
  - On [Verdict: BLIND_SPOT]: address the deeper issue the planner surfaced before continuing.
  - On [Verdict: EXECUTOR_WRONG]: fix the specific SQL error; keep the spec.
  - On [Verdict: NA_CONFIRMED]: commit 'Not Applicable' as final answer immediately.
  - On [Verdict: ANSWER]: use the answer; continue.
  - For "most recent record per entity":
      SELECT ... FROM t WHERE date_col = (SELECT MAX(date_col) FROM t WHERE id = outer.id)
      or ROW_NUMBER() OVER (PARTITION BY id ORDER BY date_col DESC) = 1
  - FINAL SQL on its OWN LINE as the LAST line. Nothing after it.
  - Follow the spec's cte_plan exactly. Do NOT invent a different decomposition.

deep_rules: |
  - YOU MUST call ask_planner_agent before printing FINAL SQL. Hard gate, no exceptions.
  - Run each CTE separately before assembling. Verify row count and shape.
  - Aggregation level: if formula X must be averaged per entity before use in Y,
    verify the pre-aggregated CTE produces one row per entity before proceeding.
  - json_extract paths are case-sensitive — verify with a LIMIT 3 query first.
  - Apply the per-verdict actions described in the tools section.
  - Before committing "Not Applicable", call ask_planner_agent to confirm.
  - FINAL SQL on its OWN LINE as the LAST line. Nothing after it.
  - Follow the spec's cte_plan exactly — same CTE names, same structure.
