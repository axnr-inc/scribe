model:
  provider: fireworks
  model: accounts/fireworks/models/kimi-k2p6
  thinking: null
  prompt_caching: false
  temperature: null
  top_p: null
  max_tokens: null

prompt_version: livesql_grafted

# Planner (GPT-5 on OpenRouter) — normalized to match scribe_main.yaml and
# kramabench_scribe.yaml so cross-benchmark comparisons are not confounded by
# planner-model identity (Type B audit Asymmetry 5).
planner:
  provider: openrouter
  model: openai/gpt-5

execution:
  mode: quick
  max_iterations: 40
  tool_execution: sequential
  rate_limit_retries: 5
  overloaded_retries: 10

connection:
  dialect: local
  dataset: ""
  project_id: ""
  credential_path: ""
  context_dir: ""
  python_bin: python3
