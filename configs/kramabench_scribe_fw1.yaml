# KramaBench SCRIBE config — v3b sibling (FIREWORKS_API_KEY variant).
# Identical to kramabench_scribe.yaml except provider: fireworks (primary key).

model:
  provider: fireworks
  model: accounts/fireworks/models/kimi-k2p6
  thinking: null
  prompt_caching: false
  temperature: null
  top_p: null
  max_tokens: null

prompt_version: krama_grafted

planner:
  provider: openrouter
  model: deepseek/deepseek-chat-v3.1

execution:
  mode: quick
  max_iterations: 40
  tool_execution: sequential
  rate_limit_retries: 5
  overloaded_retries: 10

connection:
  dialect: local
  dataset: ""
  project_id: ""
  credential_path: ""
  context_dir: ""
  python_bin: python3
