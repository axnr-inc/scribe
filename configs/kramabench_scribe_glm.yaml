# KramaBench SCRIBE config — GLM-5.1 spec+planner experiment, FW2 variant.
# Executor (Kimi-K2.6) held constant vs Krama104 baseline.
# Spec_agent + planner_agent swapped: DeepSeek-V3.1 → GLM-5.1 (Z-AI / Zhipu).
# Tests contribution of the spec/planner model on Krama104. Cross-family
# cascade: Kimi exec / GLM plan = different training families.

model:
  provider: fireworks2
  model: accounts/fireworks/models/kimi-k2p6
  thinking: null
  prompt_caching: false
  temperature: null
  top_p: null
  max_tokens: null

prompt_version: krama_grafted

planner:
  provider: openrouter
  model: z-ai/glm-5.1

execution:
  mode: quick
  max_iterations: 40
  tool_execution: sequential
  rate_limit_retries: 5
  overloaded_retries: 10

connection:
  dialect: local
  dataset: ""
  project_id: ""
  credential_path: ""
  context_dir: ""
  python_bin: python3
