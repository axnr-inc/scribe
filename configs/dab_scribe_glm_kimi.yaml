# DAB SCRIBE — OS-only stack experiment.
# Topology: Kimi-K2.6 executor on Fireworks; GLM-5.1 planner+reviewer on OpenRouter.
# Spec extraction also uses GLM-5.1 (planner-role).
#
# Mirrors configs/kramabench_scribe_glm_fw1.yaml structure but for DAB tasks.

model:
  provider: fireworks
  model: accounts/fireworks/models/kimi-k2p6
  thinking: null
  prompt_caching: false
  temperature: null
  top_p: null
  max_tokens: null

prompt_version: krama_grafted

planner:
  provider: openrouter
  model: z-ai/glm-5.1

execution:
  mode: quick
  max_iterations: 40
  tool_execution: sequential
  rate_limit_retries: 5
  overloaded_retries: 10

connection:
  dialect: local
  dataset: ""
  project_id: ""
  credential_path: ""
  context_dir: ""
  python_bin: python3
