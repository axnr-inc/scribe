# Sentinel eval SCRIBE — Inception Mercury 2 executor + Mercury 2 planner (OpenRouter).
# Requires OPENROUTER_API_KEY.
#
# Usage:
#   SENTINEL_CONFIG=configs/sentinel_scribe_mercury2.yaml bash scripts/repro_sentinel_smoke2_mercury2.sh
# Or reuse existing specs (skip re-extraction):
#   npx tsx src/run.ts -d results/sentinel_smoke2/tasks.jsonl \
#     -c configs/sentinel_scribe_mercury2.yaml -o results/sentinel_smoke2_mercury2 \
#     --specs results/sentinel_smoke2/specs

model:
  provider: openrouter
  model: inception/mercury-2
  thinking: "high"
  prompt_caching: false
  temperature: null
  top_p: null
  max_tokens: null

prompt_version: sentinel_grafted

planner:
  provider: openrouter
  model: inception/mercury-2

execution:
  mode: quick
  max_iterations: 50
  tool_execution: sequential
  rate_limit_retries: 10
  overloaded_retries: 10

connection:
  dialect: local
  dataset: ""
  project_id: ""
  credential_path: ""
  context_dir: ""
  python_bin: python3
