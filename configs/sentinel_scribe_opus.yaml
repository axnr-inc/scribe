# Sentinel eval SCRIBE — Opus 4.7 executor + Opus 4.7 planner.
# Requires ANTHROPIC_API_KEY. After npm install, run:
#   node scripts/patch_pi_ai_env.cjs
# (pi-ai 0.62 sends budget_tokens to Opus 4.7 without this patch → 0-token no-op runs)
#
# Usage:
#   SENTINEL_CONFIG=configs/sentinel_scribe_opus.yaml bash scripts/repro_sentinel_smoke2.sh
# Or reuse existing specs (skip re-extraction):
#   npx tsx src/run.ts -d results/sentinel_smoke2/tasks.jsonl \
#     -c configs/sentinel_scribe_opus.yaml -o results/sentinel_smoke2_opus \
#     --specs results/sentinel_smoke2/specs

model:
  provider: anthropic
  model: claude-opus-4-7
  prompt_caching: true
  thinking: "xhigh"
  temperature: null
  top_p: null
  max_tokens: null

prompt_version: sentinel_grafted

planner:
  provider: anthropic
  model: claude-opus-4-7

execution:
  mode: quick
  max_iterations: 50
  tool_execution: sequential
  rate_limit_retries: 10
  overloaded_retries: 10

connection:
  dialect: local
  dataset: ""
  project_id: ""
  credential_path: ""
  context_dir: ""
  python_bin: python3
