const FOOTNOTES = {
  1: 'Liu, Lin, Hewitt et al. "Lost in the Middle: How Language Models Use Long Contexts." TACL 2024. Models attend least reliably to information placed in the middle of a long context window — exactly where a plan ends up after ten iterations of a ReAct trajectory.',
  2: 'Asai, Wu, Wang, Sil, Hajishirzi. "Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection." 2024. Self-flagging is hard; models that critique their own output systematically miss the ambiguities a fresh reader would catch.',
  3: 'Levy, Jacoby, Goldberg. "Same Task, More Tokens: the Impact of Input Length on the Reasoning Performance of LLMs." 2024. Reasoning degrades with input length even when the relevant content is present.',
  4: 'Weinmeister, K. "Six Failures of Text-to-SQL and How to Recover with ADK." Google Cloud Blog, 2025. The Sequential vs LoopAgent distinction: a sequential agent freezes interpretation before code generation begins, so an interpretation error has a single re-entry point.',
  5: 'Davidson, J. "Why Text-to-SQL Fails (and What Semantic Layers Solve)." Omni Engineering Blog, 2026. Argues that production text-to-SQL agents systematically fail on docs-defined non-default semantics, and that a small named-pattern vocabulary above the raw schema fixes most of it. SCRIBE applies the same insight to data analysis via HELPER_MANIFEST.',
  6: 'Maamari, Yang, Liu, Salman. "The Death of Schema Linking? Text-to-SQL in the Age of Well-Reasoned Language Models." 2024. Modern LLMs are robust to irrelevant schema context; pre-filtering source docs can drop the load-bearing line.',
  7: 'Nam, Yoon, Chen, Sinha, Shin, Pfister. "DS-STAR: Data Science Agent for Solving Diverse Tasks across Heterogeneous Formats and Open-Ended Queries." 2026. The closest published architectural neighbor on DABStep: role-decomposed (analyzer, planner, verifier, router) but all roles served by a single base model.',
  8: 'Egg, Goyanes, Kingma, Mora, von Werra, Wolf. "DABStep: Data Agent Benchmark for Multi-Step Reasoning." 2025. The DABStep dev set is 450 tasks (72 easy, 378 hard) over a fixed corpus of seven artifacts.',
  9: 'Lai, Vitagliano, Zhang, Kraska et al. "KramaBench: A Benchmark for AI Systems on Data-to-Insight Pipelines over Data Lakes." 2025. 104 tasks across six scientific domains, each with its own per-domain data lake.',
  10: 'The four scorer issues: (1) Precision/Recall TypeError on predicted=str, target=list defaults to 0; (1b) element-type mismatch ("2003" vs 2003) defaults to 0; (2) per-task try/except silently drops the task on any metric failure; (3) transient OpenAI failures in LLMParaphrase return None, which aggregate_results silently dropna\'s. Our patched evaluator is released alongside the harness.',
  11: 'Tier-A AUTO-INSPECT walks the AST of the last statement, detects DataFrame-typed results, and emits shape/dtypes/head automatically. Tier-B VERIFY pattern-matches groupby, merge, and boolean-mask call sites and asserts row-count monotonicity, ≤2× join growth, and non-empty filter results. Tier-C verify_step exposes nine explicit assertions drawn from Great-Expectations / pandera / dbt-test vocabularies.',
  12: 'Wilson, E.B. "Probable Inference, the Law of Succession, and Statistical Inference." JASA 1927. Wilson score intervals are well-behaved at small n where normal-approximation CIs collapse.',
};

const Fn = ({ n }) => h('sup', { className: 'fn', 'data-fn': n, title: FOOTNOTES[n] }, n);
const MarginNote = ({ n }) => h('div', { className: 'margin-note', id: `fn-${n}` },

);

const useReveal = () => {
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
};

const useActiveSection = (ids) => {
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      const visible = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible.length > 0) setActive(visible[0].target.id);
    }, { rootMargin: '-80px 0px -55% 0px', threshold: 0 });
    ids.forEach(id => { const el = document.getElementById(id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, [ids.join(',')]);
  return active;
};

const useTip = () => {
  const [tip, setTip] = useState(null);
  const show = (e, txt) => {
    const wrap = e.currentTarget.closest('.tipwrap');
    if (!wrap) return;
    const r = wrap.getBoundingClientRect();
    setTip({ x: e.clientX - r.left, y: e.clientY - r.top - 14, txt });
  };
  return { tip, show, hide: () => setTip(null) };
};

const TipDom = ({ tip }) => tip ? h('div', { className: 'tip', style: { left: tip.x, top: tip.y, transform: 'translate(-50%, -100%)' } }, tip.txt) : null;

const ArchDiagram = () => {

  const W = 760, H = 540;

  const box = (x, y, w, hh, id) => ({ x, y, w, h: hh, id, cx: x + w/2, cy: y + hh/2 });
  const nodes = {
    docs:    box(290, 20,  220, 56, 'docs'),

    frozen:  box(110, 210, 300, 80, 'frozen'),
    helper:  box(450, 210, 240, 80, 'helper'),
    exec:    box(110, 330, 300, 70, 'exec'),
    review:  box(450, 330, 240, 100, 'review'),
    answer:  box(110, 460, 300, 56, 'answer'),
  };

  const detail = {
    docs:   { t: 'Source documents', d: 'The raw inputs — manuals, schemas, fee catalogs, data lakes. SCRIBE does not pre-filter; modern LLMs handle irrelevant context well, and dropping a load-bearing line is the more expensive mistake.' },
    spec:   { t: 'Spec Agent', d: 'Reads all source documents in a clean session and emits a structured spec — interpretations, chosen interpretation, computation plan, expected output format. Runs on a strong model. Fires once per task.' },
    frozen: { t: 'Frozen spec', d: 'The contract. The executor cannot rewrite it mid-trajectory. If a verdict says it’s wrong, the reviewer overwrites it on disk and the executor refreshes its anchor via read_current_spec. The interpretations[] array surfaces 2–4 plausible readings before committing.' },
    helper: { t: 'HELPER_MANIFEST', d: 'A small named-pattern vocabulary the executor pre-imports: read_multi_header_excel, parse_missing_marker, bp_to_calendar_year. When docs define non-default semantics, we lift them into helpers instead of asking the executor to re-derive them per call.' },
    exec:   { t: 'ReAct Executor', d: 'Standard ReAct loop with a Python REPL. Runs on a smaller open-weights model. The run_python wrapper injects Tier-A [AUTO-INSPECT] and Tier-B [VERIFY] tags — both LLM-free deterministic checks.' },
    review: { t: 'Review Agent', d: 'Same model as Spec, continuing the same session so docs context is preserved. Re-reads source documents via read_file before replying. Returns one of six verdicts, each with a scripted executor follow-up.' },
    answer: { t: 'Final answer', d: 'Committed only on the ANSWER or NA_CONFIRMED verdict. By that point the spec has been re-grounded, the executor’s code has produced output, and the reviewer has confirmed both.' },
  };

  const Node = ({ id }) => {
    const n = nodes[id];
    const isActive = active === id;
    const isDim = active && active !== id;
    return h('g', {
      className: 'arch-node-g',
      style: { opacity: isDim ? 0.4 : 1 },
      onMouseEnter: () => setActive(id),
      onMouseLeave: () => setActive(null),
    },
      h('rect', { x: n.x, y: n.y, width: n.w, height: n.h, rx: 4, fill: isActive ? '#fff' : 'var(--paper)', stroke: isActive ? 'var(--accent)' : 'var(--ink-2)', strokeWidth: 1 }),
      h('text', { x: n.cx, y: n.cy + 4, textAnchor: 'middle', style: { fontFamily: 'Inter', fontSize: 13.5, fontWeight: 500, fill: 'var(--ink)' } }, detail[id].t)
    );
  };

  const VArrow = ({ from, to, label, side = 'right' }) => {
    const a = nodes[from], b = nodes[to];
    let x1, y1, x2, y2;
    if (a.cy < b.cy) { x1 = a.cx; y1 = a.y + a.h; x2 = b.cx; y2 = b.y; }
    else { x1 = a.cx; y1 = a.y; x2 = b.cx; y2 = b.y + b.h; }
    return h('g', null,
      h('line', { x1, y1, x2, y2, stroke: 'var(--ink-3)', strokeWidth: 1, markerEnd: 'url(#arr-ink)' }),
      label && h('text', { x: (x1+x2)/2 + (side === 'right' ? 8 : -8), y: (y1+y2)/2 + 4, textAnchor: side === 'right' ? 'start' : 'end', style: { fontFamily: 'Source Serif 4', fontStyle: 'italic', fontSize: 12, fill: 'var(--ink-3)' } }, label)
    );
  };

  const HArrow = ({ from, to, label, color = 'var(--ink-3)', dashed = false }) => {
    const a = nodes[from], b = nodes[to];
    const leftToRight = a.x < b.x;
    const x1 = leftToRight ? a.x + a.w : a.x;
    const x2 = leftToRight ? b.x : b.x + b.w;
    const y1 = a.cy, y2 = b.cy;
    return h('g', null,
      h('line', { x1, y1, x2, y2, stroke: color, strokeWidth: 1, strokeDasharray: dashed ? '4 4' : 'none', markerEnd: `url(#arr-${dashed ? 'warn' : 'helper'})` }),
      label && h('text', { x: (x1+x2)/2, y: y1 - 6, textAnchor: 'middle', style: { fontFamily: 'Source Serif 4', fontStyle: 'italic', fontSize: 12, fill: color } }, label)
    );
  };

  return h('div', { className: 'diagram tipwrap' },
    h('svg', { className: 'chart', viewBox: `0 0 ${W} ${H}` },
      h('defs', null,
        h('marker', { id: 'arr-ink', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto' },
          h('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'var(--ink-3)' })),
        h('marker', { id: 'arr-warn', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto' },
          h('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'var(--warn)' })),
        h('marker', { id: 'arr-helper', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto' },
          h('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: '#6a4a8a' }))
      ),
      h(VArrow, { from: 'docs', to: 'spec', label: 'read' }),
      h(VArrow, { from: 'spec', to: 'frozen', label: 'save_spec' }),
      h(VArrow, { from: 'frozen', to: 'exec', label: 'run_python' }),
      h(VArrow, { from: 'exec', to: 'answer', label: 'emit' }),
      h(HArrow, { from: 'helper', to: 'exec', label: 'preamble', color: '#6a4a8a' }),
      h(HArrow, { from: 'exec', to: 'review', label: 'ask_spec_agent', color: 'var(--warn)', dashed: true }),
      h('path', { d: 'M 450 380 Q 380 340 410 290', fill: 'none', stroke: 'var(--warn)', strokeWidth: 1, strokeDasharray: '4 4', markerEnd: 'url(#arr-warn)' }),
      h('text', { x: 360, y: 348, style: { fontFamily: 'Source Serif 4', fontStyle: 'italic', fontSize: 12, fill: 'var(--warn)' } }, 'revised spec'),
      h('path', { d: 'M 690 380 Q 720 200 510 50', fill: 'none', stroke: 'var(--ink-3)', strokeWidth: 1, strokeDasharray: '4 4', markerEnd: 'url(#arr-ink)' }),
      h('text', { x: 705, y: 200, style: { fontFamily: 'Source Serif 4', fontStyle: 'italic', fontSize: 12, fill: 'var(--ink-3)' } }, 'read_file'),
      h('rect', { x: 95, y: 320, width: 605, height: 120, rx: 6, fill: 'none', stroke: 'var(--ink-4)', strokeWidth: 0.7, strokeDasharray: '2 4', opacity: 0.7 }),
      h('text', { x: 698, y: 444, textAnchor: 'end', style: { fontFamily: 'Source Serif 4', fontStyle: 'italic', fontSize: 11, fill: 'var(--ink-4)' } }, 'active escalation loop'),
      Object.keys(nodes).map(id => h(Node, { key: id, id }))
    ),
    active && h('div', { style: { marginTop: 16, padding: '14px 18px', background: '#fff', border: '1px solid var(--line)', borderRadius: 4, fontSize: 14, color: 'var(--ink-2)', lineHeight: 1.55 } },
      h('div', { style: { fontFamily: 'Inter', fontSize: 11, fontWeight: 600, color: 'var(--ink)', letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 4 } }, detail[active].t),
      detail[active].d
    ),
    !active && h('div', { style: { marginTop: 12, fontFamily: 'Inter', fontSize: 11, color: 'var(--ink-4)', letterSpacing: '0.04em', textAlign: 'center' } }, 'Hover any node for the design decision behind it.')
  );
};

const KramaChart = () => {
  const [mode, setMode] = useState('lenient');
  const { tip, show, hide } = useTip();
  const W = 720, H = 360, P = { l: 36, r: 36, t: 30, b: 70 };
  const innerW = W - P.l - P.r, innerH = H - P.t - P.b;
  const groupW = innerW / KRAMA_DATA.length;
  const barW = groupW * 0.32;

  return h('div', { className: 'diagram tipwrap' },
    h('div', { className: 'chart-head' },
      h('div', { className: 'chart-title' }, 'KramaBench — per-domain pass rates (104 tasks, patched scorer)'),
      h('div', { className: 'chart-controls' },
        ['strict','lenient'].map(m => h('button', { key: m, className: mode === m ? 'on' : '', onClick: () => setMode(m) }, m))
      )
    ),
    h('svg', { className: 'chart', viewBox: `0 0 ${W} ${H}` },
      [25,50,75,100].map(v =>
        h(React.Fragment, { key: v },
          h('line', { x1: P.l, x2: P.l + innerW, y1: P.t + innerH - (v/100)*innerH, y2: P.t + innerH - (v/100)*innerH, stroke: 'var(--line)', strokeWidth: 1 }),
          h('text', { x: P.l - 8, y: P.t + innerH - (v/100)*innerH + 4, textAnchor: 'end', style: { fontFamily: 'Inter', fontSize: 11, fill: 'var(--ink-4)' } }, v)
        )
      ),
      KRAMA_DATA.map((d, i) => {
        const cx = P.l + i*groupW + groupW/2;
        const scribe = mode === 'strict' ? d.strict : d.lenient;
        const baselineH = (d.baseline/100)*innerH;
        const scribeH = (scribe/100)*innerH;
        const wins = scribe > d.baseline;
        return h('g', { key: d.domain },
          h('rect', {
            x: cx - barW - 3, y: P.t + innerH - baselineH, width: barW, height: baselineH,
            fill: '#c7c0b3', rx: 2,
            onMouseMove: (e) => show(e, `smolagents-DR ${d.domain}: ${d.baseline.toFixed(1)}%`),
            onMouseLeave: hide
          }),
          h('rect', {
            x: cx + 3, y: P.t + innerH - scribeH, width: barW, height: scribeH,
            fill: wins ? '#2563a5' : '#7a7367', rx: 2,
            onMouseMove: (e) => show(e, `SCRIBE ${mode} ${d.domain}: ${scribe.toFixed(1)}%`),
            onMouseLeave: hide
          }),
          h('text', { x: cx - barW/2 - 3, y: P.t + innerH - baselineH - 5, textAnchor: 'middle', style: { fontFamily: 'JetBrains Mono', fontSize: 10, fill: 'var(--ink-3)' } }, d.baseline.toFixed(1)),
          h('text', { x: cx + barW/2 + 3, y: P.t + innerH - scribeH - 5, textAnchor: 'middle', style: { fontFamily: 'JetBrains Mono', fontSize: 10, fontWeight: 600, fill: wins ? 'var(--accent-2)' : 'var(--ink-2)' } }, scribe.toFixed(1)),
          h('text', { x: cx, y: P.t + innerH + 18, textAnchor: 'middle', style: { fontFamily: 'Inter', fontSize: 12, fill: 'var(--ink-2)' } }, d.domain),
          h('text', { x: cx, y: P.t + innerH + 32, textAnchor: 'middle', style: { fontFamily: 'Inter', fontSize: 10, fill: 'var(--ink-4)' } }, `n=${d.n}`),
          h('text', { x: cx, y: P.t + innerH + 50, textAnchor: 'middle', style: { fontFamily: 'JetBrains Mono', fontSize: 11, fontWeight: 600, fill: wins ? 'var(--success)' : 'var(--warn)' } }, (wins ? '+' : '') + (scribe - d.baseline).toFixed(1))
        );
      })
    ),
    h(TipDom, { tip }),
    h('div', { style: { display: 'flex', gap: 24, fontFamily: 'Inter', fontSize: 12, color: 'var(--ink-3)', marginTop: 12, justifyContent: 'center', flexWrap: 'wrap' } },
      h('span', null, h('span', { style: { display: 'inline-block', width: 10, height: 10, background: '#c7c0b3', borderRadius: 2, marginRight: 6, verticalAlign: 'middle' } }), 'smolagents-DR Claude-3.7 (published)'),
      h('span', null, h('span', { style: { display: 'inline-block', width: 10, height: 10, background: '#2563a5', borderRadius: 2, marginRight: 6, verticalAlign: 'middle' } }), `SCRIBE ${mode} (patched scorer)`)
    )
  );
};

    h('blockquote', { className: 'pull' }, '“The plan looks fine, ship it.”'),
    h('p', null,
      'Self-reflecting executors are bad at finding their own ambiguity. A boolean-mask filter that returned zero rows? A groupby that lost 80% of the input? The agent keeps going because the code “ran”. We fix this by forcing the executor to externalize a structured five-header summary before escalation, and having a separate Reviewer re-read the docs against those assumptions.'
    ),
    h('h3', { className: 'sub' }, 'Iteration-cap death'),
    h('blockquote', { className: 'pull' }, '“Forty ReAct turns later, still no answer.”'),
    h('p', null,
      'Without a forced exit, executors thrash. We measured that all successful runs commit by iteration 15 (median 7); only 20% of failed runs do.', h(Fn, { n: 3 }), ' So we put the mandatory escalation rule exactly there. At iter 15, escalation isn’t optional.'
    ),
    h('blockquote', { className: 'pull' }, 'One agent cannot simultaneously be a careful documents-reader, an aggressive code-generator, and a skeptical reviewer. So we stopped asking it to.'),

    h('h2', { className: 'section', id: 'architecture' }, 'SCRIBE architecture'),
    h('p', null,
      'SCRIBE decomposes the agent into three roles: a ', h('strong', null, 'Spec Agent'), ' that reads documents in a clean session and writes a frozen contract; a ', h('strong', null, 'ReAct Executor'), ' that runs the contract against a Python REPL; and a ', h('strong', null, 'Review Agent'), ' that re-grounds the executor’s work against the source docs. The Spec and Review agents are the same model in the same conversation — context is preserved between planning and review. The Executor is a separate, cheaper model. The architectural lever is asymmetric model assignment: a strong model fires only at the planning and review edges, where document grounding lives; an open-weights executor handles the bulk of per-task tokens.'
    ),
    h(ArchDiagram),
    h('div', { className: 'figure-cap' },
      h('strong', null, 'Figure 1.'), ' SCRIBE three-role topology. Solid arrows trace the main flow (docs → spec → frozen contract → executor → answer). Dashed red shows the escalation cascade — the executor escalating to the reviewer, the reviewer returning a revised spec. The HELPER_MANIFEST (purple) is the semantic-layer move: paradigm-level helpers pre-loaded into the executor so it doesn’t re-derive non-default semantics per call.'
    ),

    h('h2', { className: 'section', id: 'design' }, 'Four design moves'),
    h('p', null,
      'The topology isn’t novel for its own sake. Sequential-vs-LoopAgent decomposition predates this paper', h(Fn, { n: 4 }), '. What earned its keep was the ', h('em', null, 'combination'), ' of four primitives, each of which tracks a specific measured failure mode and a specific piece of prior practitioner wisdom.'
    ),
    h('h3', { className: 'sub' }, '1 · The frozen-spec contract'),
    h('p', null,
      'The first agent reads the docs once, in a clean session, and emits a ', h('code', null, 'computation_plan'), ' the executor must follow. The executor never re-reads source documents directly. If the spec is wrong, the reviewer overwrites it on disk, and the executor refreshes its anchor via a tool called ', h('code', null, 'read_current_spec'), '. Every revision is persisted as ', h('code', null, '<task>.rev<N>.json'), ' with a full audit trail.'
    ),
    h('h3', { className: 'sub' }, '2 · HELPER_MANIFEST — a semantic layer for code'),
    h('p', null,
      'Docs frequently define non-default semantics: multi-header Excel files, “—” as missing-value sentinel, before-present radiocarbon dates. We lifted those into a small named-pattern vocabulary the spec_agent can reference and the executor can call directly. ', h('code', null, 'read_multi_header_excel'), '. ', h('code', null, 'parse_missing_marker'), '. ', h('code', null, 'bp_to_calendar_year'), '. This is what the semantic-layer thesis prescribes for text-to-SQL', h(Fn, { n: 5 }), '; the insight transfers to data analysis. On KramaBench it bought us ', h('strong', null, '+38.9 points on biomedical'), ' over the published baseline.'
    ),
    h('h3', { className: 'sub' }, '3 · A six-verdict review cascade'),
    h('p', null,
      'A binary “no flag / flag” reviewer was lossy: it conflated distinct failure types into the same downstream action. We separated them into six scripted verdicts, each with a deterministic follow-up. The cascade became a converging stop signal instead of free-form review text. We expand it in the next section.'
    ),
    h('h3', { className: 'sub' }, '4 · Tier-A / B / C deterministic verifiers'),
    h('p', null,
      'Inside the executor, we inject LLM-free checks that catch the silent errors self-reflecting agents miss', h(Fn, { n: 11 }), '. Tier-A ', h('code', null, '[AUTO-INSPECT]'), ' prints shape, dtypes, and head of any trailing DataFrame automatically. Tier-B ', h('code', null, '[VERIFY]'), ' is a pattern-triggered tag that asserts row-count monotonicity on ', h('code', null, 'groupby'), ', ≤2× growth on ', h('code', null, 'merge'), '/', h('code', null, 'join'), ', and non-empty filters on boolean masks. Tier-C ', h('code', null, 'verify_step'), ' is an opt-in tool with nine assertions drawn from Great-Expectations and pandera.'
    ),
    h('div', { className: 'code-block' },
      h('span', { className: 'c1' }, '>>> '), 'result = df.groupby(\'merchant_id\').agg({\'amount\':\'sum\'})\n',
      h('span', { className: 'c2' }, '[AUTO-INSPECT]\n'),
      '  shape: (1247, 1)\n',
      '  dtypes: amount=float64\n',
      '  head: aggregate produced 1247 rows from 4810 input rows\n',
      h('span', { className: 'c3' }, '[VERIFY: groupby PASS — row count strictly decreased]')
    ),

    h('h2', { className: 'section', id: 'cascade' }, 'The six-verdict cascade'),
    h('p', null,
      'The Review Agent doesn’t return prose. It returns one of six tags, evaluated in priority order. Each has a scripted executor follow-up — the cascade is a converging stop signal, not free-form review text. The priority order is load-bearing: a ', h('code', null, 'SPEC_WRONG'), ' always pre-empts an ', h('code', null, 'EXECUTOR_WRONG'), ', because if the spec is wrong, the executor’s output being wrong is downstream and irrelevant.'
    ),
    h('div', { className: 'verdict-grid' },
      VERDICTS.flatMap((v, i) => [
        h('span', { key: 'tag-'+i, className: `tag ${v.tone}` }, v.tag),
        h('span', { key: 'desc-'+i, className: 'desc' }, v.desc)
      ])
    ),
    h('p', null,
      'Six verdicts isn’t arbitrary. Five was what we shipped first (no ', h('code', null, 'SPEC_DOUBT'), '); we added the sixth after watching the v3 pilot fail-class where two equally defensible interpretations of a question would survive docs grounding and the cascade had nowhere productive to go. ', h('code', null, 'SPEC_DOUBT'), ' gave the reviewer a verdict that maps to “re-extract with explicit alternatives” instead of forcing a wrong commitment.'
    ),

    h('h2', { className: 'section', id: 'results' }, 'Results'),
    h('p', null,
      'We evaluated SCRIBE on two public benchmarks. DABStep', h(Fn, { n: 8 }), ' is the empirical testbed for general docs-heavy data analysis — 450 tasks over a fixed corpus of seven documents. KramaBench', h(Fn, { n: 9 }), ' is the cross-domain stress test — 104 tasks across six scientific data lakes. We used the same harness on both. No per-benchmark tuning.'
    ),
    h('h3', { className: 'sub' }, 'DABStep'),
    h(DABStepTable),
    h('div', { className: 'figure-cap' },
      h('strong', null, 'Table 1.'), ' DABStep accuracy and cost. SCRIBE on the public dev set with consensus gold; DS-STAR', h(Fn, { n: 7 }), ' on the leaderboard (hidden test) as reported by Nam et al.'
    ),
    h('p', null,
      'SCRIBE reaches 269/450 = 59.8% overall: 95.8% on the easy split, 52.9% on the hard split. The single-model GPT-5 baseline on our diagnostic test set passes 20% at $0.37/task; SCRIBE passes 80% at $0.10/task on the same set — higher accuracy at roughly 3.7× lower cost. The cost mechanism is asymmetric model assignment: the strong model fires only at the planning and review edges, both small per-task token volumes; the cheap executor runs the bulk of the trajectory.'
    ),
    h('h3', { className: 'sub' }, 'KramaBench'),
    h('p', null,
      'KramaBench is structurally different: every task has its own per-domain data lake (tens to hundreds of files instead of a fixed corpus), and the answer types span numeric exact, list exact, string approximate, and list approximate. For this study we ran a fully open-source configuration: DeepSeek-V3.1 for spec and review, Kimi-K2.6 for the executor. A streaming orchestrator pipelined spec extraction into executor runs, so all 104 tasks finished in 2h25m for $39 of executor cost.'
    ),
    h(KramaChart),
    h('div', { className: 'figure-cap' },
      h('strong', null, 'Figure 2.'), ' Per-domain pass rates on KramaBench under our patched scorer', h(Fn, { n: 10 }), '. The strict-vs-lenient distinction is only about the F1 threshold on list_approximate answer types (strict: F1 = 1.0; lenient: F1 ≥ 0.5); both use the same bug-patched scorer.'
    ),
    h('p', null,
      'Overall: 68/104 = 65.4% strict, 71/104 = 68.3% lenient, beating the published smolagents-DR Claude-3.7 baseline (55.83%) by 9.6 to 12.5 points. The per-domain split tells a clean story about when role separation pays off. Docs-heavy paradigms — biomedical assay protocols, environmental measurement conventions, legal corpora with explicit definitions — are where SCRIBE adds 15 to 39 points. Convention-heavy paradigms — archeology rank inversions, astronomy field conventions — are where the F-E ceiling applies (see the next section).'
    ),
    h(CostAccChart),
    h('div', { className: 'figure-cap' },
      h('strong', null, 'Figure 3.'), ' Cost-accuracy frontier on the held-out diagnostic (n=5). SCRIBE is strictly better than the GPT-5-solo monolith on both axes. The Wilson 95% interval', h(Fn, { n: 12 }), ' for 4/5 is [37.6%, 96.4%]; the diagnostic is qualitative (the wrong-answer disagreement structure across single-session agents), not a powered estimate. Large-n confirmation lives in the DABStep headline (n=450) and the KramaBench transfer (n=104).'
    ),

    h('h2', { className: 'section', id: 'ceiling' }, 'Where SCRIBE has a ceiling'),
    h('p', null,
      'On KramaBench’s archeology and astronomy domains, three independently configured stacks — different spec models, different planners, different executors, no shared model family between v2 and v3 — converge on the exact same wrong number ', h('em', null, 'to six decimal places'), '. Cascade interventions (a question-restating gate, a ', h('code', null, 'SPEC_DOUBT'), ' verdict) don’t change it. Multi-spec sampling within a model family doesn’t either.'
    ),
    h(FeTable),
    h('div', { className: 'figure-cap' },
      h('strong', null, 'Table 2.'), ' Three independently configured stacks converge to identical six-decimal wrong values on hard-9 (gold +0.015648; all three produce −0.210104). v2 and v3 share no model family at any role. Architecture-level interventions — the I-1 question-restating gate, the SPEC_DOUBT verdict — do not change the verdict. The mechanism is upstream of the cascade.'
    ),
    h('p', null,
      'The reason is mechanical. The question’s intended interpretation lives in an implicit field convention that isn’t stated in any source document. Barrington Atlas rank as inverse-importance (lower number = more important). Radiocarbon dates as raw years-before-present versus calibrated calendar years. No doc passage adjudicates. Whatever the spec_agent picks, the reviewer has nothing docs-grounded with which to disagree — so the cascade verifies ', h('em', null, 'within'), ' the wrong frame.'
    ),
    h('p', null,
      'We call this regime ', h('strong', null, 'F-E: cascade consensus on a plausible-but-wrong interpretation'), '. The paper discloses it openly because it’s the architecturally honest finding. Deeper cascade verdicts will not escape it. Sub-task ground-truth labels, or a domain-knowledge layer above the cascade, will.'
    ),
    h('blockquote', { className: 'pull' },
      'If your problem looks like KramaBench’s astronomy — convention-heavy, implicit-interpretation — call us before you deploy. That’s where this gets interesting, not where it gets ignored.'
    ),

    h('h2', { className: 'section', id: 'deploy' }, 'Deploy it on your data'),
    h('div', { className: 'cta-card' },
      h('h2', null, 'Working with us'),
      h('p', null,
        'SCRIBE is the harness we ship with. The architecture is model-agnostic — bring whichever frontier model you’re already paying for, and any open-weights executor your infrastructure supports. We wire up the spec extractor for your document corpus, configure the helper manifest for your domain semantics, and ship a reference deployment that runs on your data, not ours. Four to six weeks to a first production deployment.'
      ),
      h('div', { className: 'cta-row' },
        h('a', { href: 'mailto:hello@actioneer.com?subject=SCRIBE%20deployment%20enquiry', className: 'btn primary' }, 'Email the team →'),
        h('a', { href: '#faq', className: 'btn ghost' }, 'Frequently asked')
      )
    ),

    h('h2', { className: 'section', id: 'faq' }, 'Frequently asked'),
    h('details', { className: 'faq' },
      h('summary', null, 'Does this work with closed-weights models only?'),
      h('p', null,
        'Yes. The asymmetric assignment isn’t architecturally required — it’s the cost lever. If you want GPT-5 on all three roles, the architecture still works; you just pay $1.84 per correct answer instead of $0.13. The role separation alone gives you most of the accuracy lift.'
      )
    ),
    h('details', { className: 'faq' },
      h('summary', null, 'How does SCRIBE compare to DS-STAR / smolagents / MetaGPT?'),
      h('p', null,
        'DS-STAR is the closest architectural neighbor on DABStep — also role-decomposed, but with all roles served by a single base model. On the public dev set SCRIBE exceeds DS-STAR’s reported leaderboard numbers on every split. A hidden-test leaderboard submission is future work. AutoGen / MetaGPT / CAMEL are general multi-agent frameworks; SCRIBE is a specific harness for docs-heavy data analysis tuned for production cost-per-correct.'
      )
    ),
    h('details', { className: 'faq' },
      h('summary', null, 'What about the scorer bugs you mention?'),
      h('p', null,
        'We audited the official KramaBench scorer and identified four issues that produce silent task drops; the patched evaluator is released alongside the paper and all KramaBench numbers in this post use it. The smolagents-DR baseline number is the value the KramaBench paper published under their unpatched scorer; we couldn’t re-grade it because predictions were not released. The comparability caveat is documented in the paper.'
      )
    ),
    h('details', { className: 'faq' },
      h('summary', null, 'Where does SCRIBE not work?'),
      h('p', null,
        'On convention-heavy domains where the intended interpretation isn’t stated in any source document, cascade interventions don’t help. Three independently configured stacks converge to the same wrong answer to six decimals. Sub-task ground-truth labels or an explicit domain-knowledge layer above the cascade are the architecturally honest fix. Talk to us — that’s where deployment gets interesting.'
      )
    ),
    h('details', { className: 'faq' },
      h('summary', null, 'Is the harness open-source?'),
      h('p', null,
        'Yes. The harness, the patched KramaBench scorer, the helper manifest, and the reproduction recipes will be public on release. The paper is under triple-blind submission to ICDM 2026; once the review cycle closes the repository link will be in the final version.'
      )
    ),
    h('details', { className: 'faq' },
      h('summary', null, 'How much does this cost per task in production?'),
      h('p', null,
        'On DABStep, $0.33 per task end-to-end. On KramaBench, roughly $0.40 per task averaged across the six domains. Your numbers depend on docs size and answer-type mix; we measure it together during the discovery call.'
      )
    ),

    h('div', { className: 'div-dot' }, '· · ·'),
    h('p', { style: { fontFamily: 'Inter', fontSize: 13, color: 'var(--ink-3)' } },
      'For correspondence about this engineering note, write ', h('a', { href: 'mailto:hello@actioneer.com' }, 'hello@actioneer.com'), '.'
    )
  );
};

const MarginCol = () => h('aside', { className: 'margin-col' },
  h('div', { className: 'margin-notes' },
    Object.keys(FOOTNOTES).map(n => h(MarginNote, { key: n, n: parseInt(n) }))
  )
);

const App = () => h(React.Fragment, null,
  h(Topbar),
  h('div', { className: 'page' },
    h(TocCol),
    h(Article),
    h(MarginCol)
  ),
  h('footer', { className: 'site' },
    h('div', { className: 'row' },
      h('span', null, '© 2026 Actioneer · SCRIBE is open-source'),
      h('span', null, 'Paper under triple-blind submission · ICDM 2026 Applied Track')
    )
  )
);

createRoot(document.getElementById('app')).render(h(App));
</script>
