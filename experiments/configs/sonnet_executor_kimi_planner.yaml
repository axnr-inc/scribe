model:
  provider: anthropic
  model: claude-sonnet-4-6
  thinking: "high"
  prompt_caching: true
  temperature: null
  top_p: null
  max_tokens: null

prompt_version: dabstep_grafted_iterative

# Role-reversed planner: Kimi K2.6 (the model that produced wrong answers as
# executor) is now the escalation target. Tests whether Kimi can produce useful
# clarification when the executor is stuck.
planner:
  provider: openrouter
  model: moonshotai/kimi-k2.6

execution:
  mode: quick
  max_iterations: 40
  tool_execution: sequential
  rate_limit_retries: 5
  overloaded_retries: 10

connection:
  dialect: local
  dataset: ""
  project_id: ""
  credential_path: ""
  context_dir: ""
  python_bin: python3
